name: orden
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orden
      POSTGRES_USER: orden
      POSTGRES_PASSWORD: orden
    # El retraso hace reproducible el experimento en computadores rapidos.
    entrypoint: ["sh", "-c", "sleep 3; exec docker-entrypoint.sh postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orden -d orden"]
      interval: 3s
      timeout: 3s
      retries: 10
  cliente:
    image: postgres:18
    environment:
      PGPASSWORD: orden
    command: ["psql", "-h", "postgres", "-U", "orden", "-d", "orden", "-c", "select 'la base contesto' as resultado"]
    depends_on:
      postgres:
        condition: service_healthy
